version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lunar-habitat-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-lunar_habitat}
      MYSQL_USER: ${DB_USERNAME:-lunar_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lunar_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3306:3306"
    volumes:
      - lunar_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-lunar_user}", "-p${DB_PASSWORD:-lunar_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lunar-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunar-habitat-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-lunar_habitat}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-lunar_user}
      DB_PASSWORD: ${DB_PASSWORD:-lunar_pass}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - lunar-network

volumes:
  lunar_mysql_data:
    driver: local

networks:
  lunar-network:
    driver: bridge
