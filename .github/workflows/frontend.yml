name: Frontend CI

on:
  push:
    branches: [ "main", "fullstack-3d-rebuild" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: TypeScript Check
      run: |
        cd frontend
        npm run typecheck

    - name: Lint
      run: |
        cd frontend
        npm run lint

    - name: Test
      run: |
        cd frontend
        npm test --if-present

    - name: Production Build
      run: |
        cd frontend
        npm run build
