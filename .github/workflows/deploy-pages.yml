name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Validate Production Deployment Variables
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::CRITICAL PRODUCTION CONFIGURATION ERROR: vars.VITE_API_URL is not set in GitHub repository variables."
            echo "Configure vars.VITE_API_URL in Repository Settings -> Secrets and variables -> Actions -> Variables to your stable HTTPS backend gateway."
            exit 1
          fi
          if [ -z "${{ vars.VITE_WS_URL }}" ]; then
            echo "::error::CRITICAL PRODUCTION CONFIGURATION ERROR: vars.VITE_WS_URL is not set in GitHub repository variables."
            echo "Configure vars.VITE_WS_URL (e.g., wss://<domain>/ws) in Repository Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Build frontend for GitHub Pages
        run: |
          cd frontend
          npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE_PATH: '/lunar-habitat-environmental-control/'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_ENABLE_DEMO_CREDENTIALS: 'false'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
