<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Access | Lunar Habitat Operations Console</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body style="background: radial-gradient(circle at center, #111a36 0%, #070a13 100%);">

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">🌙</div>
            <h1 style="font-size: 22px; font-weight: 700; margin-bottom: 6px;">LUNAR HABITAT</h1>
            <div style="font-size: 12px; color: var(--accent-cyan); letter-spacing: 1px; text-transform: uppercase;">
                Environmental Control & Resource Accounting
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" style="margin-bottom: 20px;">
            <span>⚠️</span>
            <span th:text="${errorMessage}">Invalid operator credentials.</span>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-success" style="margin-bottom: 20px;">
            <span>🔒</span>
            <span th:text="${logoutMessage}">Terminal session closed.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="username">Operator Identification</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username (e.g., admin)" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Security Access Key</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px; margin-top: 10px;">
                Authenticate Access Key
            </button>
        </form>

        <div style="margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 12px; color: var(--text-muted); line-height: 1.6;">
            <div><strong>Demo Operator Credentials:</strong></div>
            <div style="display: flex; justify-content: space-between; margin-top: 4px;">
                <span>Admin / Operator / Accountant:</span>
                <code style="color: var(--accent-cyan); font-family: var(--font-mono);">admin / operator / accountant</code>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 4px;">
                <span>Passcode:</span>
                <code style="color: var(--accent-cyan); font-family: var(--font-mono);">admin123</code>
            </div>
        </div>
    </div>
</div>

</body>
</html>
