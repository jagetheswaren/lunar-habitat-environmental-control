# ==============================================================================
# LUNAR HABITAT V2.1 — PRODUCTION PROFILE CONFIGURATION
# ==============================================================================

server.port=${PORT:8081}

# Database Configuration (External Persistent MySQL 8.0+)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA and Hibernate (Strict schema validation against Flyway)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migrations (Applied automatically upon boot)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Actuator Health & Metrics (Public health status, internal metrics protected)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Production Logging Levels (No sensitive credential/token logs)
logging.level.com.lunar.habitat=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.hibernate=WARN
